<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            color: #343a40;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }
        h1 {
            font-size: 5rem;
            margin-bottom: 0.5rem;
            color: #007bff; /* Bootstrap primary color */
        }
        h2 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }
    </style>
</head>
<body data-bs-theme="dark">
    <style>
        body[data-bs-theme="dark"] {
            background-color: #343a40;
            color: #f8f9fa;
        }
        body[data-bs-theme="dark"] .container {
            background-color: #454d55;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }
        body[data-bs-theme="dark"] h1 {
            color: #007bff; /* Bootstrap primary color for dark mode */
        }
        body[data-bs-theme="dark"] .btn-primary {
            background-color: #0056b3;
            border-color: #0056b3;
        }
        body[data-bs-theme="dark"] .btn-primary:hover {
            background-color: #003f7f;
            border-color: #003f7f;
        }
    </style>
    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="/" class="btn btn-primary mt-3">Go to Home Page</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
